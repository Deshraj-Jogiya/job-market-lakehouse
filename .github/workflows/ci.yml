name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pyspark-and-great-expectations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Generate the synthetic raw data
        run: python data/generate_raw_data.py
      - name: Run the real PySpark transform (joins, groupBy aggregation, window function)
        run: python spark_jobs/transform.py
      - name: Run the HiveQL job (external + partitioned Parquet tables, dynamic partitions, MSCK REPAIR, pruning)
        run: python spark_jobs/hive_tables.py
      - name: Run the real Great Expectations validation on the PySpark output
        run: python great_expectations/validate_outputs.py
      - name: Build the real HTML data-quality dashboard from the validation results
        run: python great_expectations/build_dashboard.py
      - name: Run the PySpark unit tests
        run: python -m pytest tests/ -v
      - name: Upload the dashboard as a real, downloadable CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: data-quality-dashboard
          path: data/output/dashboard.html

  airflow-dag:
    runs-on: ubuntu-latest
    needs: pyspark-and-great-expectations
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Create an isolated venv for the pipeline's own dependencies
        run: |
          python -m venv /tmp/task-venv
          /tmp/task-venv/bin/pip install --quiet -r requirements.txt
      - name: Install Airflow into the runner's own environment (pinned constraints)
        run: |
          AIRFLOW_VERSION=2.10.2
          PYTHON_VERSION="$(python --version | cut -d' ' -f2 | cut -d'.' -f1-2)"
          CONSTRAINT_URL="https://raw.githubusercontent.com/apache/airflow/constraints-${AIRFLOW_VERSION}/constraints-${PYTHON_VERSION}.txt"
          pip install "apache-airflow==${AIRFLOW_VERSION}" --constraint "${CONSTRAINT_URL}"
      - name: Run a real DAG test (generate -> pyspark transform -> GE validate)
        # Airflow's own pydantic/typing_extensions pins conflict with
        # pyspark/great_expectations' newer pydantic if installed together --
        # tasks invoke the isolated venv's python, not Airflow's.
        env:
          AIRFLOW_HOME: /home/runner/airflow_home
        run: |
          mkdir -p "$AIRFLOW_HOME/dags"
          sed -e "s|/opt/airflow/project|${GITHUB_WORKSPACE}|" \
              -e "s|\"python_bin\": \"python\"|\"python_bin\": \"/tmp/task-venv/bin/python\"|" \
              dags/job_market_pipeline.py > "$AIRFLOW_HOME/dags/job_market_pipeline.py"
          airflow db migrate
          airflow dags test job_market_pipeline 2026-01-01

  hadoop-hdfs-mapreduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Generate the synthetic raw data
        run: mkdir -p data/output && python data/generate_raw_data.py
      - name: Cache the Hadoop release
        id: hadoop-cache
        uses: actions/cache@v4
        with:
          path: ~/hadoop-3.4.1
          key: hadoop-3.4.1-lean
      - name: Download Hadoop 3.4.1
        if: steps.hadoop-cache.outputs.cache-hit != 'true'
        run: |
          curl -sSL https://archive.apache.org/dist/hadoop/common/hadoop-3.4.1/hadoop-3.4.1-lean.tar.gz -o /tmp/hadoop.tgz
          tar -xzf /tmp/hadoop.tgz -C ~
      - name: Start single-node HDFS, run the Hadoop Streaming MapReduce job, cross-check against Spark
        env:
          HADOOP_HOME: /home/runner/hadoop-3.4.1
        run: bash hadoop/run_hdfs_mapreduce.sh
      - name: Upload the MapReduce output
        uses: actions/upload-artifact@v4
        with:
          name: mapreduce-monthly-by-source
          path: data/output/mapreduce_monthly_by_source.tsv
